<form class="inline" method="post" action="{% url 'core:mark_done' row.task.id %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  <button type="submit">Done</button>
</form>
<form class="inline" method="post" action="{% url 'core:snooze' row.task.id %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  <button type="submit">Snooze until</button>
  <input type="date" name="date" required>
</form>
