<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Household Tasks{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f5; color: #1a1a1a; }
    header { background: #2c3e50; color: white; padding: 1rem 2rem; }
    header h1 { margin: 0; font-size: 1.25rem; }
    nav a { color: #cbd5e1; text-decoration: none; margin-right: 1rem; }
    nav a:hover { color: white; text-decoration: underline; }
    main { padding: 1.5rem 2rem; max-width: 900px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; background: white; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e2e2e2; }
    th { font-size: 0.75rem; text-transform: uppercase; color: #666; }
    .bucket { margin-bottom: 2rem; }
    .bucket h2 { font-size: 1rem; padding: 0.4rem 0.75rem; border-radius: 4px; display: inline-block; }
    .bucket-overdue h2 { background: #fde2e1; color: #a3231b; }
    .bucket-due_today h2 { background: #fef3c7; color: #92400e; }
    .bucket-due_soon h2 { background: #e0f2fe; color: #075985; }
    .status-badge { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; white-space: nowrap; }
    .status-overdue { background: #fde2e1; color: #a3231b; }
    .status-due_today { background: #fef3c7; color: #92400e; }
    .status-due_soon { background: #e0f2fe; color: #075985; }
    .status-not_due { background: #e5e7eb; color: #4b5563; }
    form.inline { display: inline; }
    button { cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 4px; padding: 0.25rem 0.6rem; font-size: 0.85rem; margin-left: 0.25rem; }
    button:hover { background: #f0f0f0; }
    .empty { color: #666; font-style: italic; }
    .note { color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Household Task Manager</h1>
    <nav>
      <a href="{% url 'core:due_list' %}">Due</a>
      <a href="{% url 'core:task_list' %}">All Tasks</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
